<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- App icon, 20 to 48 px: the chip body and die, pins dropped so it stays crisp. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="#0D181E" stroke="#223039"/>
  <rect x="6" y="6" width="20" height="20" rx="4.5" fill="none" stroke="#E2EAE5" stroke-width="2"/>
  <clipPath id="die"><rect x="10" y="10" width="12" height="12" rx="1.5"/></clipPath>
  <g clip-path="url(#die)">
    <rect x="10" y="10" width="4" height="12" fill="#FF5D6E"/>
    <rect x="14" y="10" width="4" height="12" fill="#56DB8F"/>
    <rect x="18" y="10" width="4" height="12" fill="#42A3FD"/>
  </g>
</svg>
