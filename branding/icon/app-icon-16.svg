<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- App icon, 16 px: just the three LED bars on the tile, aligned to whole pixels. -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#0D181E"/>
  <rect x="3" y="3" width="10" height="10" rx="2" fill="#E2EAE5"/>
  <clipPath id="die"><rect x="4" y="4" width="8" height="8" rx="1"/></clipPath>
  <g clip-path="url(#die)">
    <rect x="4" y="4" width="3" height="8" fill="#FF5D6E"/>
    <rect x="7" y="4" width="2" height="8" fill="#56DB8F"/>
    <rect x="9" y="4" width="3" height="8" fill="#42A3FD"/>
  </g>
</svg>
